# ==============================================================================
# Catavor Production Reference Nginx Reverse Proxy Configuration (N-56)
# Validasi sintaks: nginx -t -c /path/to/deploy/nginx.conf
# ==============================================================================

worker_processes auto;
pid /tmp/catavor-nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Batas ukuran unggahan maksimum (selaras dengan validasi media backend 15MB)
    client_max_body_size 15m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    #Pemulihan IP asli pengunjung hanya dari rentang CIDR resmi Cloudflare
    include cloudflare-ips.conf;

    # Zona rate-limit ketat khusus endpoint autentikasi & MFA di level edge proxy (10 req/menit per IP asli)
    limit_req_zone $binary_remote_addr zone=catavor_auth_zone:10m rate=10r/m;
    limit_req_status 429;

    upstream catavor_backend {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Redirect seluruh HTTP ke HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name catavor.com www.catavor.com;
        return 301 https://$host$request_uri;
    }

    # Server utama HTTPS (Cloudflare Full Strict Mode + Origin CA Certificate)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name catavor.com www.catavor.com;

        # Pasang sertifikat Cloudflare Origin CA atau Let's Encrypt pada path berikut di host produksi
        ssl_certificate     /etc/ssl/catavor/origin-cert.pem;
        ssl_certificate_key /etc/ssl/catavor/origin-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_timeout 1d;
        ssl_session_cache shared:CatavorSSL:10m;
        ssl_session_tickets off;

        # Defense-in-depth Origin Header Secret (pendamping wajib firewall UFW/Security Group)
        # Aktifkan di produksi setelah Transform Rule Cloudflare mengirim X-Catavor-Origin-Verify:
        # if ($http_x_catavor_origin_verify != "GANTI_DENGAN_SECRET_ORIGIN_ACA_PANJANG") {
        #     return 403;
        # }

        # Security Headers dasar pada lapisan Reverse Proxy
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Endpoint autentikasi, OTP, dan verifikasi MFA dilindungi rate-limit ketat
        location ~ ^/api/(login|register|forgot-password|reset-password|auth/) {
            limit_req zone=catavor_auth_zone burst=8 nodelay;

            proxy_pass http://catavor_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }

        # Endpoint Server-Sent Events (SSE) notifikasi real-time (tanpa buffering)
        location /api/notifications/stream {
            proxy_pass http://catavor_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        # Trafik aplikasi umum & aset statis
        location / {
            proxy_pass http://catavor_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
}
