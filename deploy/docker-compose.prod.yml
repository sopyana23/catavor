# ==============================================================================
# Catavor Enterprise SaaS — Hardened Production Docker Compose Stack
#
# Arsitektur Jaringan Zero-Trust:
#   1. catavor_data_internal (internal: true) -> PostgreSQL 17 (TLS) & Redis 7 (Auth+AOF)
#      terisolasi penuh tanpa akses keluar/masuk internet publik.
#   2. catavor_edge_internal (internal: true, 172.28.10.0/24) -> Jembatan privat
#      antara Caddy (172.28.10.10) dan Catavor; TRUSTED_PROXIES dikunci presisi
#      hanya ke IP Caddy (172.28.10.10) dan loopback.
#   3. catavor_public_egress -> Dipakai Catavor untuk verifikasi DNS live custom domain
#      (TXT/CNAME/A), SMTP email keluar, dan Google OAuth2; sementara PostgreSQL dan
#      Redis tetap terisolasi di catavor_data_internal.
#   4. Port 8000 aplikasi hanya dibuka ke loopback host (127.0.0.1:8000) untuk
#      probe /healthz & /readyz lokal, TIDAK terekspos ke publik.
#
# Cara menjalankan (dari root repositori):
#   docker compose --env-file deploy/.env.production -f deploy/docker-compose.prod.yml up -d --build
# ==============================================================================

name: catavor-prod

services:
  postgres:
    image: postgres:17.12-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-catavor_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env.production}
      POSTGRES_DB: ${DB_NAME:-catavor}
      TZ: UTC
    volumes:
      - catavor_pg_data:/var/lib/postgresql/data
      - catavor_pg_ssl:/var/lib/postgresql/ssl
    # Aktifkan TLS otomatis pada PostgreSQL container (offline tanpa internet) agar DB_SSLMODE=require terpenuhi sejak boot pertama.
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -f /var/lib/postgresql/ssl/server.key ]; then
          openssl req -new -x509 -days 3650 -nodes \
            -subj "/CN=postgres.catavor.internal" \
            -out /var/lib/postgresql/ssl/server.crt \
            -keyout /var/lib/postgresql/ssl/server.key
          chown postgres:postgres /var/lib/postgresql/ssl/server.key /var/lib/postgresql/ssl/server.crt
          chmod 0600 /var/lib/postgresql/ssl/server.key
          chmod 0644 /var/lib/postgresql/ssl/server.crt
        fi
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/var/lib/postgresql/ssl/server.crt \
          -c ssl_key_file=/var/lib/postgresql/ssl/server.key \
          -c max_connections=150
    networks:
      - catavor_data_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD wajib diisi di .env.production}
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - catavor_redis_data:/data
    networks:
      - catavor_data_internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  catavor:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: catavor:prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env.production
    environment:
      APP_ENV: production
      PORT: "8000"
      BIND_ADDR: "0.0.0.0"
      TRUSTED_PROXIES: "172.28.10.10,127.0.0.1,::1"
      DB_HOST: ${DB_HOST_DOCKER:-postgres}
      DB_PORT: ${DB_PORT_DOCKER:-5432}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DB_AUTO_MIGRATE: "false"
      REDIS_ADDR: ${REDIS_ADDR_DOCKER:-redis:6379}
      STORAGE_LOCAL_ROOT: /data/storage
      STORAGE_PRIVATE_ROOT: /data/private_storage
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - catavor_public_storage:/data/storage
      - catavor_private_storage:/data/private_storage
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - catavor_data_internal
      - catavor_edge_internal
      - catavor_public_egress

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - catavor
    environment:
      CATAVOR_DOMAIN: ${CATAVOR_DOMAIN:-catavor.com}
      ACME_EMAIL: ${ACME_EMAIL:-ops@catavor.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - ./cloudflare-ips.caddy:/etc/caddy/cloudflare-ips.caddy:ro
      - catavor_caddy_data:/data
      - catavor_caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      catavor_edge_internal:
        ipv4_address: 172.28.10.10
      catavor_public_egress: {}

networks:
  catavor_data_internal:
    driver: bridge
    internal: true
  catavor_edge_internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.10.0/24
  catavor_public_egress:
    driver: bridge

volumes:
  catavor_pg_data:
  catavor_pg_ssl:
  catavor_redis_data:
  catavor_public_storage:
  catavor_private_storage:
  catavor_caddy_data:
  catavor_caddy_config:
