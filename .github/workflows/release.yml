name: Release

# =============================================================================
# Alur rilis:
#   1. Dipicu oleh tag `v*` (mis. v1.0.0) atau manual (workflow_dispatch).
#   2. Bangun dan uji dulu — image TIDAK dibangun bila test gagal.
#   3. Build image multi-stage, pindai kerentanan dengan Trivy.
#   4. Dorong ke GHCR dengan tag versi + sha + latest.
#
# Migrasi database TIDAK dijalankan di sini. DB_AUTO_MIGRATE=false di produksi,
# jadi migrasi dijalankan manual dengan prosedur di docs/deployment.md.
# =============================================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Dorong image ke GHCR'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gerbang mutu: rilis hanya boleh jalan bila backend & frontend lulus.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Backend build & test
        working-directory: backend
        run: |
          go build ./...
          go vet ./...
          go test ./... -race -count=1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/desktop/package-lock.json
            frontend/mobile/package-lock.json

      - name: Frontend typecheck & build
        run: |
          set -e
          for spa in desktop mobile; do
            echo "::group::frontend/$spa"
            cd "frontend/$spa"
            npm ci --no-audit --no-fund
            npx tsc -b --noEmit
            npm run build
            cd ../..
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Build & dorong image.
  # ---------------------------------------------------------------------------
  image:
    name: Build & push image
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.push_image
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Pindai image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Ringkasan
        run: |
          {
            echo "### Image rilis"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Tag | \`${{ github.ref_name }}\` |"
            echo ""
            echo "Tag yang tersedia:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
