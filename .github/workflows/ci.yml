name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Batalkan run lama bila ada push baru di ref yang sama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, vet, race + PG17 test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verifikasi go.mod konsisten
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Siapkan DB disposable PostgreSQL 17 untuk uji migrasi & konkurensi
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS catavor_ci_migtest;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS catavor_ci_pgtest;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE catavor_ci_migtest;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE catavor_ci_pgtest;"

      - name: Test (race detector + PostgreSQL 17 disposable + coverage)
        # -race butuh cgo. Runner ubuntu-latest menyediakan gcc, dan dua DB
        # disposable terpisah memastikan uji migrasi (internal/database) serta
        # uji konkurensi/FK nyata (internal/handlers) tidak saling mengganggu.
        env:
          CATAVOR_MIGTEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=catavor_ci_migtest sslmode=disable"
          CATAVOR_PGTEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=catavor_ci_pgtest sslmode=disable"
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Tampilkan coverage
        run: go tool cover -func=coverage.out | tail -20

      - name: Ambang batas coverage modul kritis
        # Ambang PER PAKET agar penurunan pada modul keamanan/MFA/CLI langsung terdeteksi.
        run: |
          set -euo pipefail
          check() {
            pkg="$1"; min="$2"
            got=$(go test -cover "./$pkg/..." 2>/dev/null | grep -o 'coverage: [0-9.]*%' | head -1 | tr -dc '0-9.')
            if [ -z "$got" ]; then
              echo "::error::tidak bisa mengukur coverage paket $pkg"
              exit 1
            fi
            echo "$pkg: ${got}% (minimum ${min}%)"
            awk -v g="$got" -v m="$min" -v p="$pkg" 'BEGIN {
              if (g+0 < m+0) { printf "::error::coverage %s turun ke %s%%, di bawah minimum %s%%\n", p, g, m; exit 1 }
            }'
          }
          check internal/security 85
          check internal/mfa      42
          check cmd/admin-cli     50
          check internal/models   28
          check internal/storage  22
          check internal/services  2
          check internal/handlers  1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ desktop, tablet, mobile ]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # WAJIB `-b`. tsconfig.json di ketiga SPA memakai project references.
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

  security:
    name: Security (secrets, vulns, deps, ops scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validasi sintaks skrip operasional deploy/
        run: |
          set -euo pipefail
          for s in deploy/*.sh; do
            bash -n "$s"
          done
          DRY_RUN=1 bash deploy/generate-prod-secrets.sh
          TMP_ENV="$(mktemp)"
          trap 'rm -f "$TMP_ENV"' EXIT
          OUT_FILE="$TMP_ENV" FORCE_OVERWRITE=1 bash deploy/generate-prod-secrets.sh
          SKIP_LIVE_PROBES=1 ENV_FILE="$TMP_ENV" bash deploy/preflight-check.sh
          DRY_RUN=1 ADMIN_SSH_CIDR="203.0.113.10/32" bash deploy/setup-ufw-cloudflare.sh >/dev/null

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: npm audit (desktop)
        working-directory: frontend/desktop
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (tablet)
        working-directory: frontend/tablet
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (mobile)
        working-directory: frontend/mobile
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catavor
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: [ '6379:6379' ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: local
      PORT: '8000'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: catavor
      DB_SSLMODE: disable
      DB_AUTO_MIGRATE: 'true'
      SKIP_DB_MIGRATE: 'false'
      JWT_SECRET: ci-e2e-jwt-secret-not-for-production-0123456789abcdef
      MFA_ENCRYPTION_KEY: ci-e2e-mfa-secret-not-for-production-fedcba9876543210
      REDIS_ADDR: 127.0.0.1:6379
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      CATAVOR_ADMIN_EMAIL: e2e-admin@catavor.test
      CATAVOR_ADMIN_PASSWORD: 'E2eTest!2026'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build server
        working-directory: backend
        run: go build -o /tmp/catavor-server ./cmd/server

      - name: Start server (sekaligus AutoMigrate + migrasi SQL)
        working-directory: backend
        run: |
          set -euo pipefail
          /tmp/catavor-server > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "server siap setelah ${i} detik"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server tidak siap dalam 60 detik"
          tail -50 /tmp/server.log
          exit 1

      - name: Seed fixture E2E
        working-directory: backend
        run: |
          set -euo pipefail
          go run ./cmd/seed-e2e
          go run ./cmd/seed_adidas

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test deps + browser
        working-directory: tests
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Jalankan E2E
        working-directory: tests
        run: npx playwright test --reporter=list

      - name: Log server bila E2E gagal
        if: failure()
        run: tail -100 /tmp/server.log

      - name: Upload artefak E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/test-results
            tests/playwright-report
          retention-days: 7

  # Satu job penentu untuk branch protection: wajib lulus semua di atas.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [ backend, frontend, security, e2e ]
    if: always()
    steps:
      - name: Cek hasil semua job
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "Salah satu job gagal:"
            echo "  backend  = ${{ needs.backend.result }}"
            echo "  frontend = ${{ needs.frontend.result }}"
            echo "  security = ${{ needs.security.result }}"
            echo "  e2e      = ${{ needs.e2e.result }}"
            exit 1
          fi
          echo "Semua job lulus."
