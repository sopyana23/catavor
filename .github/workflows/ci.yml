name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Batalkan run lama bila ada push baru di ref yang sama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verifikasi go.mod konsisten
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector + coverage)
        # -race butuh cgo. Runner ubuntu-latest menyediakan gcc, jadi aman
        # dijalankan di sini (tidak bisa jalan di Windows/MSYS lokal).
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Tampilkan coverage
        run: go tool cover -func=coverage.out | tail -20

      - name: Ambang batas coverage modul kritis
        # Ambang PER PAKET, bukan angka global. Angka global menyesatkan karena
        # handlers/services masih rendah dan akan menyembunyikan penurunan di
        # modul keamanan. Setiap ambang disetel sedikit di bawah nilai nyata
        # saat ini agar build tidak merah tanpa alasan, tetapi cukup ketat
        # untuk menangkap regresi (test yang terhapus/dinonaktifkan).
        #
        #   security  90.2%  -> ambang 85
        #   models    31.4%  -> ambang 28
        #   storage   26.1%  -> ambang 22
        #   services   2.5%  -> ambang 2
        #   handlers   1.4%  -> ambang 1
        run: |
          set -euo pipefail
          check() {
            pkg="$1"; min="$2"
            got=$(go test -cover "./$pkg/..." 2>/dev/null | grep -o 'coverage: [0-9.]*%' | head -1 | tr -dc '0-9.')
            if [ -z "$got" ]; then
              echo "::error::tidak bisa mengukur coverage paket $pkg"
              exit 1
            fi
            echo "$pkg: ${got}% (minimum ${min}%)"
            awk -v g="$got" -v m="$min" -v p="$pkg" 'BEGIN {
              if (g+0 < m+0) { printf "::error::coverage %s turun ke %s%%, di bawah minimum %s%%\n", p, g, m; exit 1 }
            }'
          }
          check internal/security 85
          check internal/models   28
          check internal/storage  22
          check internal/services  2
          check internal/handlers  1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ desktop, mobile ]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Catatan: `defaults.run.working-directory` TIDAK berlaku untuk
          # langkah `uses:`. Path harus relatif ke root repo, kalau tidak
          # setup-node gagal mencari .nvmrc (bug yang tertangkap CI #1).
          # Samakan dengan .nvmrc dan field "engines" di package.json.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # WAJIB `-b`. tsconfig.json di kedua SPA hanya berisi "references",
        # jadi `tsc --noEmit` tanpa -b tidak memeriksa satu file pun dan
        # selalu lolos (bug nyata: 4 error pdfjs lolos lewat cara ini).
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build

  security:
    name: Security (secrets, vulns, deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: npm audit (desktop)
        working-directory: frontend/desktop
        # --omit=dev: hanya dependency produksi yang jadi blocker.
        # Kerentanan di devDependency dilaporkan tapi tidak menggagalkan build.
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (mobile)
        working-directory: frontend/mobile
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    # Suite E2E menembak server sungguhan, jadi butuh Postgres + Redis nyata.
    # Fixture deterministik dibuat oleh backend/cmd/seed-e2e (idempoten),
    # sehingga job ini tidak bergantung pada isi DB lokal siapa pun.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catavor
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: [ '6379:6379' ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # .env tidak di-commit (gitignore), jadi konfigurasi lewat env proses.
      APP_ENV: local
      PORT: '8000'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: catavor
      DB_SSLMODE: disable
      # DB kosong: AutoMigrate wajib jalan agar tabel + migrasi ter-embed terbentuk.
      DB_AUTO_MIGRATE: 'true'
      SKIP_DB_MIGRATE: 'false'
      JWT_SECRET: ci-e2e-jwt-secret-not-for-production-0123456789abcdef
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      CATAVOR_ADMIN_EMAIL: e2e-admin@catavor.test
      CATAVOR_ADMIN_PASSWORD: 'E2eTest!2026'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build server
        working-directory: backend
        run: go build -o /tmp/catavor-server ./cmd/server

      - name: Start server (sekaligus AutoMigrate + migrasi SQL)
        working-directory: backend
        run: |
          set -euo pipefail
          /tmp/catavor-server > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "server siap setelah ${i} detik"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server tidak siap dalam 60 detik"
          tail -50 /tmp/server.log
          exit 1

      # Fixture HARUS setelah server jalan: skema dibuat AutoMigrate saat boot.
      # seed_master sengaja TIDAK dipakai — ia meng-TRUNCATE seluruh tabel dan
      # akan menghapus fixture ini.
      - name: Seed fixture E2E
        working-directory: backend
        run: |
          set -euo pipefail
          go run ./cmd/seed-e2e
          go run ./cmd/seed_adidas

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test deps + browser
        working-directory: tests
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Jalankan E2E
        working-directory: tests
        run: npx playwright test --reporter=list

      - name: Log server bila E2E gagal
        if: failure()
        run: tail -100 /tmp/server.log

      - name: Upload artefak E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/test-results
            tests/playwright-report
          retention-days: 7

  # Satu job penentu untuk branch protection: wajib lulus semua di atas.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [ backend, frontend, security, e2e ]
    if: always()
    steps:
      - name: Cek hasil semua job
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "Salah satu job gagal:"
            echo "  backend  = ${{ needs.backend.result }}"
            echo "  frontend = ${{ needs.frontend.result }}"
            echo "  security = ${{ needs.security.result }}"
            echo "  e2e      = ${{ needs.e2e.result }}"
            exit 1
          fi
          echo "Semua job lulus."
