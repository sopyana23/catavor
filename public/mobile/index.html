    <!-- Tri-Frontend Universal Device & Form-Factor Classifier Engine -->
    <script>
      (function() {
        var CURRENT_BUNDLE = 'mobile';

        function detectTarget() {
          var search = window.location.search || '';

          // 1. Explicit query parameter (?view=desktop|tablet|mobile) takes absolute priority for testing/dev
          var queryMatch = search.match(/[?&]view=(desktop|tablet|mobile)(?:&|$)/i);
          if (queryMatch) {
            var forced = queryMatch[1].toLowerCase();
            try { sessionStorage.setItem('catavor_forced_view', forced); } catch (e) {}
            return forced;
          }

          // If query param ?view=auto or ?view=reset is passed, clear forced view
          if (/[?&]view=(auto|reset)(?:&|$)/i.test(search)) {
            try { sessionStorage.removeItem('catavor_forced_view'); } catch (e) {}
          }

          // 2. Hardware and Pointer Capability Extraction
          var ua = navigator.userAgent || '';
          var navPlatform = navigator.platform || '';
          var maxTouch = navigator.maxTouchPoints || 0;

          // Universal Brand-Agnostic Tablet Signals
          var isAppleTablet = /ipad/i.test(ua) || (navPlatform === 'MacIntel' && maxTouch > 1);
          var isAndroid = /android/i.test(ua);
          var isAndroidTablet = isAndroid && !/mobile/i.test(ua);
          var isGenericTabletUA = /tablet|silk|kindle|playbook/i.test(ua);
          var isMobileUA = /mobile|iphone|ipod|android.*mobile|windows phone|blackberry/i.test(ua);

          // Accurate Viewport Measurement (Prioritizes CSS Media Query & innerWidth over physical screen)
          var isMobileMedia = window.matchMedia ? window.matchMedia('(max-width: 767.98px)').matches : false;
          var isTabletMedia = window.matchMedia ? window.matchMedia('(min-width: 768px) and (max-width: 1023.98px)').matches : false;
          var winW = window.innerWidth || (document.documentElement ? document.documentElement.clientWidth : 0);

          // Classification logic:
          // A. Mobile Viewport or Phone UA
          if (isMobileMedia || (winW > 0 && winW < 768)) {
            return 'mobile';
          }
          if (isMobileUA && !isAppleTablet && !isAndroidTablet && !isGenericTabletUA && !isTabletMedia && (winW === 0 || winW < 768)) {
            return 'mobile';
          }

          // B. Tablet Viewport or Tablet UA
          if (isTabletMedia || (winW >= 768 && winW < 1024) || isAppleTablet || isAndroidTablet || isGenericTabletUA) {
            return 'tablet';
          }

          // C. Desktop
          return 'desktop';
        }

        function syncAndSwitch(target) {
          try {
            // Synchronize persistent cookie so Go backend serves the correct bundle on next request
            var cookieMatch = document.cookie.match(/(?:^|;\s*)catavor_device=([^;]+)/);
            var currentCookie = cookieMatch ? cookieMatch[1].toLowerCase() : null;
            if (currentCookie !== target) {
              document.cookie = "catavor_device=" + target + "; path=/; max-age=31536000; SameSite=Lax";
            }

            if (CURRENT_BUNDLE !== target) {
              var lastSwitch = sessionStorage.getItem('catavor_device_switched');
              var now = Date.now();
              if (!lastSwitch || (now - parseInt(lastSwitch, 10)) > 1500) {
                sessionStorage.setItem('catavor_device_switched', now.toString());
                window.location.replace(window.location.href);
              }
            }
          } catch (e) {}
        }

        try {
          var initialTarget = detectTarget();
          syncAndSwitch(initialTarget);

          // Dynamic Resize & DevTools Device Toggle Listener
          // When a developer or user resizes window or toggles mobile emulation in DevTools,
          // smoothly reload into the matching native bundle without manual page refresh.
          var resizeTimeout = null;
          function handleDynamicResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
              var updatedTarget = detectTarget();
              if (updatedTarget !== CURRENT_BUNDLE) {
                syncAndSwitch(updatedTarget);
              }
            }, 300);
          }

          window.addEventListener('resize', handleDynamicResize);
          window.addEventListener('orientationchange', handleDynamicResize);
        } catch (e) {}
      })();
    </script>
    <!-- Google Identity Services Client SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google OAuth Popup Interceptor & Communication Bridge -->
    <script>
      (function() {
        try {
          var hash = window.location.hash || '';
          var search = window.location.search || '';
          var isOAuthCallback = (hash.indexOf('access_token=') !== -1 || hash.indexOf('id_token=') !== -1 || search.indexOf('code=') !== -1);
          
          if (isOAuthCallback) {
            var payload = {
              type: 'CATAVOR_GOOGLE_AUTH_CALLBACK',
              hash: hash,
              search: search,
              timestamp: Date.now()
            };

            // 1. Send via BroadcastChannel (Works across all windows/popups on same origin even without opener)
            try {
              if (typeof BroadcastChannel !== 'undefined') {
                var bc = new BroadcastChannel('catavor_oauth_channel');
                bc.postMessage(payload);
              }
            } catch (e) {}

            // 2. Send via localStorage storage event (Cross-window broadcast)
            try {
              localStorage.setItem('catavor_oauth_broadcast', JSON.stringify(payload));
            } catch (e) {}

            // 3. Send via window.opener if available
            try {
              if (window.opener && window.opener !== window) {
                window.opener.postMessage(payload, window.location.origin);
              }
            } catch (e) {}

            // 4. Close popup immediately
            try {
              window.close();
            } catch (e) {}

            // 5. If window.close is prevented by browser, show clean minimal success state & stop app mount
            window.__IS_OAUTH_POPUP_CALLBACK__ = true;
            document.addEventListener('DOMContentLoaded', function() {
              if (window.__IS_OAUTH_POPUP_CALLBACK__) {
                document.body.innerHTML = `
                  <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0b1329; color: #f8fafc; text-align: center; padding: 24px; box-sizing: border-box;">
                    <div style="width: 56px; height: 56px; border-radius: 50%; background: #10b981; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);">
                      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </div>
                    <h2 style="margin: 0 0 8px; font-size: 1.25rem; font-weight: 700;">Login Berhasil!</h2>
                    <p style="margin: 0 0 20px; font-size: 0.9rem; color: #94a3b8; max-width: 280px; line-height: 1.4;">Autentikasi Google berhasil diproses. Jendela ini dapat Anda tutup.</p>
                    <button onclick="window.close()" style="background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);">Tutup Jendela Ini</button>
                  </div>
                `;
              }
            });
          }
        } catch (e) {
          console.error('OAuth interceptor error:', e);
        }
      })();
    </script>
